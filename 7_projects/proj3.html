<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <h1>Digital Clock</h1>
    <div class="center">
    <div id="banner"><span>Your Local Time: </span></div>
    <div id="clock"></div>
    </div>
</body>
<style>
    h1{
    text-align: center;
}

.center{
    display: flex;
    height: 100px;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#banner{
    text-align: center;
}

#clock{
    width: 180px;
    height: 60px;
    background-color: orange;
    font-size: 30px;
    padding: 10px;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: nowrap;
}
</style>
<script>
    const clock=document.getElementById('clock'); // pick div id="clock"
    // const clock=document.querySelector('#clock'); // pick div id="clock"

    
    setInterval(function(){
        // console.log(date.toLocaleTimeString());
        let date=new Date();
        clock.innerHTML=date.toLocaleTimeString()
    },1000) // 1000- 1 second
</script>
</html>
